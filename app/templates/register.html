{% extends "base.html" %}
{% block title %}Регистрация — Учебная платформа{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Регистрация</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

  <form method="post" action="{{ url_for('register') }}">
    <label>Роль
      <select name="role" required>
        <option value="student">Студент</option>
        <option value="teacher">Преподаватель</option>
      </select>
    </label>
    <label>ФИО
      <input type="text" name="full_name" placeholder="Иванов Иван Иванович">
    </label>
    <label>Группа <span class="hint">(для студента)</span>
      <input type="text" name="group_name" placeholder="ИС-21">
    </label>
    <label>Предмет <span class="hint">(для преподавателя)</span>
      <input type="text" name="subject" placeholder="Программирование">
    </label>
    <label>Логин
      <input type="text" name="login" required autocomplete="username">
    </label>
    <label>Пароль <span class="hint">(мин. 6 символов, хранится в зашифрованном виде)</span>
      <input type="password" name="password" minlength="6" required autocomplete="new-password">
    </label>
    <label>Повторите пароль
      <input type="password" name="password2" minlength="6" required autocomplete="new-password">
    </label>
    <button class="btn-primary" type="submit">Создать аккаунт</button>
  </form>

  <p class="muted center">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
